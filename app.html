<style>
:root{--bg:#F3EEE6;--surface:#FBF8F3;--ink:#1C1814;--mute:#7A7066;--line:#DDD5C8;--accent:#8A5A3C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="ink"]{--bg:#14110E;--surface:#1D1914;--ink:#F3EEE6;--mute:#A0958A;--line:#332D26;--accent:#D4A582}
@media (prefers-color-scheme:dark){:root:not([data-theme="ivory"]){--bg:#14110E;--surface:#1D1914;--ink:#F3EEE6;--mute:#A0958A;--line:#332D26;--accent:#D4A582}}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 20px 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:500 20px Fraunces,Georgia,serif;color:var(--ink);text-decoration:none}
.brand{display:inline-flex;align-items:center;gap:1px}
.brand .logo{height:1.4em;width:auto;display:block;margin-right:1px}
.right{display:flex;gap:8px;align-items:center}
.free{font:600 11px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:5px 10px}
.theme{border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:6px 12px;font:500 12px Inter,sans-serif;cursor:pointer}
.eyebrow{margin:40px 0 10px;font:600 11px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font:400 clamp(36px,10.5vw,54px)/1.05 Fraunces,Georgia,serif;letter-spacing:-.02em;overflow-wrap:anywhere}
h1 em{color:var(--accent)}
.lede{color:var(--mute);margin:14px 0 0;max-width:46ch}
.card{margin-top:22px;display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.card h3{margin:0;font:400 22px Fraunces,Georgia,serif}
.card p{margin:0;color:var(--mute);font-size:14px}
input,textarea{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:10px 2px;outline:none;border-radius:0;resize:vertical}
textarea{min-height:120px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px}
input:focus,textarea:focus{border-color:var(--accent)}
::placeholder{color:var(--mute)}
.btn{border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:600 14px Inter,sans-serif;padding:12px 22px;cursor:pointer;justify-self:start;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.bar{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 8px}
.bar h2{margin:0;font:400 26px Fraunces,Georgia,serif}
.count{color:var(--mute);font-size:13px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}
li.lst{align-items:center;cursor:pointer}
li.lst .t{font:400 20px Fraunces,Georgia,serif}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--mute);background:none;cursor:pointer;margin-top:1px;color:var(--bg);font-size:13px;line-height:1}
li.done .chk{background:var(--accent);border-color:var(--accent)}
li.done .t{text-decoration:line-through;color:var(--mute)}
.body{flex:1;min-width:0}
.t{overflow-wrap:anywhere}
.by{font-size:12px;color:var(--mute);margin-top:2px}
.del{border:0;background:none;color:var(--mute);cursor:pointer;font-size:20px;line-height:1;padding:0 4px}
.empty{padding:26px 0;color:var(--mute);border-top:1px solid var(--line);font:italic 400 18px Fraunces,Georgia,serif}
.note{margin-top:18px;font-size:12px;color:var(--mute);min-height:1em}
.back{color:var(--mute);font-size:13px;text-decoration:none;display:inline-block;margin-top:34px}
.ad{margin-top:44px;border:1px dashed var(--line);border-radius:20px;padding:16px;display:grid;gap:6px}
.ad{position:relative}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.adhide{position:absolute;top:12px;right:14px;font-size:12px;color:var(--mute)}
.ad small{font:600 10px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.ad b{font:400 20px Fraunces,Georgia,serif}
.ad span{color:var(--mute);font-size:14px}
.acts{display:flex;gap:0;flex:none;margin:-8px -8px -8px 0}
.ic{border:0;background:none;color:var(--mute);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.ic:hover{color:var(--ink);background:var(--surface)}
.ic.armed{color:#fff;background:#B3402F}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{flex:none;min-width:1.7em;text-align:right;color:var(--mute);font:500 15px/24px Inter,sans-serif;font-variant-numeric:tabular-nums}
.btn.on{background:var(--ink);color:var(--bg)}
.hint{font-size:12px;color:var(--accent);margin-top:4px}
li.head{padding-top:22px}
li.head .t{font:500 21px Fraunces,Georgia,serif;letter-spacing:.01em}
.ic.on{color:var(--accent)}
.ubar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:2px;background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 6px 4px 16px;box-shadow:0 8px 24px rgba(0,0,0,.3);font:500 13px Inter,sans-serif;white-space:nowrap}
.ubar span{margin-right:6px}
.ubar .ic{color:var(--bg)}
.ubar .ic:hover{background:rgba(128,128,128,.3)}
.ubar .ic:disabled{opacity:.3;cursor:default}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;border:1px solid var(--line);padding:20px 20px 0;display:grid;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;color:var(--ink);font:600 14px Inter,sans-serif;padding:11px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.stk{position:sticky;bottom:0;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg);border-top:1px solid var(--line);margin:0 -20px;padding:10px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.stk .btn{width:100%;justify-self:stretch;text-align:center;padding:11px 8px;font-size:13px}
.stk>button:nth-child(5){grid-column:1/-1}
.stk a.btn:nth-child(1){background:#25D366;color:#fff}.stk a.btn:nth-child(2){background:#229ED9;color:#fff}
.cust{border-bottom:1px solid var(--line);margin-bottom:6px}.cust summary{cursor:pointer;font:600 14px Inter,sans-serif;padding:6px 0 16px;color:var(--mute)}
.cbody{display:grid;gap:14px;padding-bottom:6px}
.sh-top{display:flex;justify-content:space-between;align-items:center}
.sh-top h3{margin:0;font:400 24px Fraunces,Georgia,serif}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:8px 14px;font:500 13px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbl{font:600 11px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0}
.tg{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.tg label{display:flex;align-items:center;gap:6px;cursor:pointer}
.tg input{width:auto;border:0;padding:0;margin:0;accent-color:var(--accent)}
.cf{display:grid;gap:8px}
.cf textarea{min-height:56px}
.bubble{background:var(--bub);color:var(--bubt);border-radius:16px 16px 4px 16px;padding:12px 14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:280px;overflow:auto;line-height:1.45}
:root{--bub:#DDF3CF;--bubt:#1C1814}
:root[data-theme="ink"]{--bub:#1F4F40;--bubt:#F3EEE6}
@media (prefers-color-scheme:dark){:root:not([data-theme="ivory"]){--bub:#1F4F40;--bubt:#F3EEE6}}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:12px}
.ad{margin-top:28px;padding:10px 14px;border-style:solid;opacity:.72}
.ad b{font-size:15px}.ad span{font-size:12px}.ad .btn{padding:7px 14px;font-size:12px}
.fmt{margin-top:22px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:grid;gap:2px;padding:14px 16px 8px}
.fmtctl{display:grid;gap:0}
.fmt h4{margin:0;padding:0 0 4px;font:600 15px Inter,sans-serif;color:var(--ink)}
.fmtrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--ink);font:500 15px Inter,sans-serif;padding:6px 0;min-height:44px;cursor:pointer;text-align:left}
.fmtrow b{font-weight:600;color:var(--mute)}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);transition:transform .2s}
.fmtrow.on .sw{background:var(--ink)}.fmtrow.on .sw:after{transform:translateX(18px)}
.grip{cursor:grab;touch-action:none;font-size:22px;line-height:1;margin:-6px 0 -6px -10px;color:var(--mute)}
li.drag{background:color-mix(in srgb,var(--accent) 30%,var(--surface));outline:2px solid var(--accent);box-shadow:0 12px 28px rgba(0,0,0,.4);border-radius:12px;position:relative;z-index:2;transform:scale(1.04);padding-left:8px;padding-right:8px;transition:transform .12s,box-shadow .12s}
ul.dragging li:not(.drag){opacity:.5;transition:opacity .12s}
.newbar{display:none;width:100%;margin-top:12px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg));color:var(--ink);border-radius:12px;padding:10px 12px;font:600 13px Inter,sans-serif;text-align:left;cursor:pointer}
li.new{box-shadow:inset 3px 0 0 var(--accent);padding-left:10px}
li.new:before{content:"NEW";flex:none;align-self:center;font:700 9px Inter,sans-serif;letter-spacing:.08em;color:var(--bg);background:var(--accent);border-radius:99px;padding:3px 6px}

<script>
(function(){
  /* Edit these to run your own ads. Leave url empty for an open slot. */
  var ADS=[{title:"Edentity by Eclipz",text:"Your digital name card. Share it in one link and let people save it with a tap.",cta:"Learn more",url:"https://edentity.eclipz.my/?site=1#top"}];

  /* Public link of this page, used in shared messages. */
  /* Once Elist has its own domain, set SHORT_BASE (e.g. "https://elist.my/") so links read elist.my/ab12cd.
     Your server must redirect that path to the page at #l-ab12cd. */
  var SHORT_BASE="";
  /* Where the Elist logo goes. Change to your landing page address. */
  var LANDING_URL="index.html";
  (function(){var b=document.querySelector(".brand");if(b&&LANDING_URL)b.setAttribute("href",LANDING_URL)})();
  var SHARE_BASE=location.origin+location.pathname;
  var $=function(i){return document.getElementById(i)};
  /* ownership + share memory (per device): lists made here, and the content last shared */
  function ordOf(it){return it.ord!=null?it.ord:(it.ts||0)}
  function lsGet(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function markMine(id){var m=lsGet("elist-mine",[]);if(m.indexOf(id)<0){m.push(id);lsSet("elist-mine",m)}}
  function isMine(id){return lsGet("elist-mine",[]).indexOf(id)>-1}
  function hashStr(t){var x=5381,i;for(i=0;i<t.length;i++)x=((x<<5)+x+t.charCodeAt(i))|0;return String(x)}
  function h(tag,props,kids){
    var e=document.createElement(tag);props=props||{};
    for(var k in props){if(k==="text")e.textContent=props[k];else if(k.slice(0,2)==="on")e[k]=props[k];else e.setAttribute(k,props[k])}
    (kids||[]).forEach(function(c){e.appendChild(c)});return e;
  }

  /* theme */
  var modes=["Auto","Ivory","Ink"],mi=0,root=document.documentElement;
  try{var s=localStorage.getItem("elist-theme");if(modes.indexOf(s)>-1)mi=modes.indexOf(s)}catch(e){}
  function theme(){var m=modes[mi];if(m==="Auto")root.removeAttribute("data-theme");else root.setAttribute("data-theme",m.toLowerCase());$("theme").textContent=m;try{localStorage.setItem("elist-theme",m)}catch(e){}}
  $("theme").onclick=function(){mi=(mi+1)%3;theme()};theme();

  /* text size: shrinks all text on the list page and on the picture cards */
  var SIZES=[1,.9,.8,.7],szi=0,textScale=1;
  try{var sv0=parseFloat(localStorage.getItem("elist-size"));if(SIZES.indexOf(sv0)>-1)szi=SIZES.indexOf(sv0)}catch(e){}
  function applySize(){
    textScale=SIZES[szi];var v=document.getElementById("view");
    if(v){if(textScale===1)v.style.removeProperty("zoom");else v.style.zoom=textScale}
    $("sizeUp").disabled=szi===0;$("sizeDn").disabled=szi===SIZES.length-1;
    try{localStorage.setItem("elist-size",String(textScale))}catch(e){}
  }
  $("sizeUp").onclick=function(){if(szi>0){szi--;applySize()}};$("sizeDn").onclick=function(){if(szi<SIZES.length-1){szi++;applySize()}};applySize();

  /* ads */
  var ad=ADS[Math.floor(Math.random()*ADS.length)];
  var adHidden=false;try{adHidden=localStorage.getItem("elist-hidead")==="1"}catch(e){}
  function syncAd(){$("ad").style.display=adHidden?"none":"";$("showad").style.display=adHidden?"inline":"none";try{localStorage.setItem("elist-hidead",adHidden?"1":"0")}catch(e){}}
  $("showad").onclick=function(){adHidden=false;syncAd()};
  var hb=h("button",{class:"linkbtn adhide","aria-label":"Hide sponsored box",text:"Hide"});hb.onclick=function(){adHidden=true;syncAd()};
  $("ad").appendChild(hb);syncAd();
  $("ad").appendChild(h("small",{text:"Sponsored · Demo"}));
  $("ad").appendChild(h("b",{text:ad.title}));
  $("ad").appendChild(h("span",{text:ad.text}));
  if(ad.url)$("ad").appendChild(h("a",{class:"btn ghost",href:ad.url,rel:"sponsored",text:ad.cta}));
  else $("ad").appendChild(h("span",{text:"Ad space available."}));

  /* ---------- data layer: shared db, or in-memory preview ---------- */
  var db=null,mem={lists:[],items:{}},subs=[];
  var obj=function(d){var v=Object.assign({},d.data()||{});v.id=d.id;return v};
  function bump(){subs.forEach(function(f){f()})}
  function subLists(cb){
    if(db)return db.collection("lists").orderBy("ts","desc").onSnapshot(function(s){cb(s.docs.map(obj))},function(){cb(null)});
    var f=function(){cb(mem.lists.slice().sort(function(a,b){return b.ts-a.ts}))};subs.push(f);f();
    return function(){subs=subs.filter(function(x){return x!==f})};
  }
  function subList(id,cb){
    if(db)return db.doc("lists/"+id).onSnapshot(function(d){cb(d.exists?obj(d):null)},function(){cb(null)});
    var f=function(){cb(mem.lists.filter(function(l){return l.id===id})[0]||null)};subs.push(f);f();
    return function(){subs=subs.filter(function(x){return x!==f})};
  }
  function subItems(id,cb){
    if(db)return db.collection("lists/"+id+"/items").orderBy("ts","asc").onSnapshot(function(s){cb(s.docs.map(obj))},function(){cb(null)});
    var f=function(){cb((mem.items[id]||[]).slice().sort(function(a,b){return ordOf(a)-ordOf(b)}))};subs.push(f);f();
    return function(){subs=subs.filter(function(x){return x!==f})};
  }
  function shortCode(){
    var a="abcdefghjkmnpqrstuvwxyz23456789",o="",r=new Uint32Array(6),i;
    try{crypto.getRandomValues(r)}catch(e){for(i=0;i<6;i++)r[i]=Math.random()*4e9}
    for(i=0;i<6;i++)o+=a[r[i]%a.length];return o;
  }
  function mkItem(t,n,d,i,c){return {text:t,name:n||"",done:!!d,check:!!c,ts:Date.now()+(i||0)}}
  function createList(title,items,name,numbered){
    var l={title:title||"Untitled list",ts:Date.now(),numbered:!!numbered};
    if(db){
      var code=shortCode(),ref=db.doc("lists/"+code);
      return ref.get().then(function(sn){if(sn.exists){code=shortCode();ref=db.doc("lists/"+code)}return ref.set(l)}).then(function(){
        var c=db.collection("lists/"+code+"/items");
        return seq(items.map(function(it,i){return [it,i]}),function(x){return retry(function(){return c.add(mkItem(x[0].text,name,x[0].done,x[1],x[0].check))})}).then(function(){markMine(code);return code});
      });
    }
    l.id=shortCode();markMine(l.id);mem.lists.push(l);mem.items[l.id]=items.map(function(it,i){var x=mkItem(it.text,name,it.done,i,it.check);x.id="i"+l.ts+i;return x});bump();
    return Promise.resolve(l.id);
  }
  function addItem(id,text,name,check){
    var it=mkItem(text,name,false,0,check);
    if(db)return db.collection("lists/"+id+"/items").add(it).then(function(r){return r.id});
    it.id="i"+it.ts;(mem.items[id]=mem.items[id]||[]).push(it);bump();return Promise.resolve(it.id);
  }
  function patchItem(lid,it,p){
    if(db)return db.doc("lists/"+lid+"/items/"+it.id).update(p);

  function parseWA(raw){
    var ts=/^\[?\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4},?\s+\d{1,2}[:.]\d{2}(?::\d{2})?\s?(?:[ap]\.?m\.?)?\]?\s*[-\u2013]?\s*[^:]{1,40}:\s*/i;

    function clean(t){var c=t.replace(lead,"").replace(/[\s*_~=:]+$/,"").trim();return c||t}

    var first=rows[0],rest=ne.slice(1),title="";
    /* The first line is the title when it has no list marker AND looks like a heading
       (colon, bold, keyword like "list", emoji header, blank line after it) or when
       the lines below it are marked as items. A plain first line with plain lines below
       stays an item. */
    if(!mark.test(first)&&ne.length>1&&first.length<=90){
      var strong=/:$/.test(first)||/^[*_]{1,2}[^*_].*[*_]{1,2}:?$/.test(first)||
        /\b(?:list|senarai|checklist|to-?do|rsvp|attendance|agenda|jadual|shopping|potluck|tugasan|kehadiran)\b/i.test(first)||
        /^[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/u.test(first)||rows[1]==="";

    }

      tw.replaceChild(inp,title);rn.style.display="none";inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);
      function done(){if(fin)return;fin=true;var v=inp.value.trim();tw.replaceChild(title,inp);rn.style.display="";
        if(v&&v!==title.textContent)setTitle(id,v).catch(function(){note.textContent="Couldn’t rename."})}
      inp.onblur=done;inp.onkeydown=function(e){if(e.key==="Enter")done()};
    });
    rn.style.marginTop="10px";tw.appendChild(rn);view.appendChild(tw);
    var bar=h("div",{class:"bar"},[h("h2",{text:"The list"})]);var cnt=h("span",{class:"count"});bar.appendChild(cnt);view.appendChild(bar);
    var ul=h("ul");view.appendChild(ul);
    var prog=h("div",{class:"prog"},[h("i")]);view.insertBefore(prog,ul);

    var tx=h("input",{placeholder:"Add an item…",maxlength:"140"}),nm=h("input",{placeholder:"Your name (optional)",maxlength:"30"});
    try{nm.value=localStorage.getItem("elist-name")||""}catch(e){}
    var ab=h("button",{class:"btn",text:"Add to list",disabled:"disabled"});
    var wc=h("input",{type:"checkbox"});
    var wcl=h("div",{class:"tg"},[h("label",{},[wc,h("span",{text:"Add with a circle (checklist item)"})])]);
    var panel=h("div",{class:"card",style:"display:none"},[h("h3",{text:"Add or edit"}),tx,nm,wcl,ab,h("p",{text:"Rows are plain text by default. Use the circle icon on a row to add a tick box, T to make it a title, and the pencil to edit."})]);
    var tog=h("button",{class:"btn",text:"Add or edit"});
    var shareBtn=h("button",{class:"btn ghost",text:"Share"});
    function shareUrl(){return SHORT_BASE?SHORT_BASE+id:(window.ELIST_SERVER?location.origin+"/"+id:(SHARE_BASE||location.href.split("#")[0])+"#l-"+id)}
    var shNote=h("p",{class:"note"}),loaded=false;
    function sig(){return hashStr(title.textContent+"\n"+items.slice().sort(function(a,b){return ordOf(a)-ordOf(b)}).map(function(i){return [i.text,i.done?1:0,i.check?1:0,i.head?1:0].join("|")}).join("\n"))}
    function syncShare(){
      if(!isMine(id)){shareBtn.style.display="none";shNote.textContent="You opened this from a shared link. Sharing is off here so the group isn’t flooded with repeats.";return}
      var last=lsGet("elist-shared",{})[id],same=!!last&&loaded&&last===sig();
      shareBtn.style.display="";shareBtn.disabled=!loaded||same;shareBtn.textContent=same?"Shared ✓":"Share";
      shNote.textContent=same?"Already shared. Share unlocks again when the list changes.":"";
    }
    shareBtn.onclick=function(){openShare(title.textContent,items,shareUrl(),numbered,function(){var m=lsGet("elist-shared",{});m[id]=sig();lsSet("elist-shared",m);syncShare()})};
    var caseBtn=h("button",{class:"btn ghost","aria-label":"Change case",title:"Change case",text:"Aa"});
    caseBtn.onclick=function(){openCase(id,title.textContent,items)};
    var numBtn=h("button",{class:"btn ghost","aria-label":"Auto number","aria-pressed":"false",title:"Auto number",text:"1."});
    numBtn.onclick=function(){setNumbered(id,!numbered).catch(function(e){note.textContent=errMsg(e)})};
    var mine=isMine(id);
    /* bottom of the list: permanent format options, then Edit/Done + Share at the right */
    numBtn.className="fmtrow";numBtn.setAttribute("role","switch");numBtn.innerHTML="<span>Auto-numbering</span><i class=\"sw\"></i>";
    caseBtn.className="fmtrow";caseBtn.innerHTML="<span>Change letter case</span><b>Aa ›</b>";
    if(mine)view.appendChild(panel);
    else{ /* visitor: add field first, right under the title */
      panel.removeChild(panel.lastChild);panel.firstChild.textContent="Add yours";panel.style.display="grid";panel.style.marginTop="14px";
      tog.textContent="Edit rows";view.insertBefore(panel,bar);
    }
    view.appendChild(h("div",{class:"fmt"},[h("h4",{text:"Format the list"}),h("div",{class:"fmtctl"},[numBtn,caseBtn])]));
    view.appendChild(h("div",{class:"row",style:"justify-content:flex-end;margin-top:12px"},[tog,shareBtn]));
    shNote.style.textAlign="right";view.appendChild(shNote);
    var note=h("p",{class:"note"});view.appendChild(note);
    if(!db)note.textContent="Preview mode: lists stay on this device only.";

    var items=[],editId=null,numbered=false;
    /* "new since your last visit" */
    var seenAt=lsGet("elist-seen",{})[id]||0,firstVisit=!seenAt,addedMine={},newDismissed=false;
    function markSeen(){var m=lsGet("elist-seen",{});m[id]=Date.now();lsSet("elist-seen",m)}
    function onHide(){if(document.visibilityState==="hidden")markSeen()}
    document.addEventListener("visibilitychange",onHide);window.addEventListener("pagehide",markSeen);
    unsub.push(function(){document.removeEventListener("visibilitychange",onHide);window.removeEventListener("pagehide",markSeen);markSeen()});
    function isNew(it){return !firstVisit&&!newDismissed&&!it.head&&!addedMine[it.id]&&(it.ts||0)>seenAt}
    var newBar=h("button",{class:"newbar"});view.insertBefore(newBar,ul);
    newBar.onclick=function(){newDismissed=true;markSeen();draw()};
    function draw(){
      syncShare();
      ul.textContent="";
      numBtn.className="fmtrow"+(numbered?" on":"");numBtn.setAttribute("aria-checked",numbered?"true":"false");
      var nmap=numbered?numMap(items):null;
      var sorted=items.slice().sort(function(a,b){return ordOf(a)-ordOf(b)});
      var real=items.filter(function(i){return i.check&&!i.head}),open=real.filter(function(i){return !i.done}).length,rowsN=items.filter(function(i){return !i.head}).length;
      cnt.textContent=real.length?open+" open · "+real.length+" total":(rowsN?rowsN+(rowsN===1?" row":" rows"):"");
      var nn=items.filter(isNew).length;newBar.style.display=nn?"block":"none";newBar.textContent="● "+nn+" new since your last visit · tap to clear";
      prog.style.display=real.length?"":"none";prog.firstChild.style.width=(real.length?Math.round(100*(real.length-open)/real.length):0)+"%";
      if(!sorted.length){ul.appendChild(h("li",{class:"empty",text:"Nothing here yet. Tap Add or edit to start."}));return}
      sorted.forEach(function(it){
        var isHead=!!it.head;
        var b=h("div",{class:"body"});
        var isEd=editing||editId===it.id;
        if(isEd){
          var inp=h("input",{value:it.text,maxlength:"140"});
          var saveIt=function(){var v=inp.value.trim();if(v&&v!==it.text)patchItem(id,it,{text:v}).catch(function(){note.textContent="Couldn’t save the edit."})};
          inp.onchange=saveIt;
          inp.onkeydown=function(e){if(e.key==="Enter"){saveIt();editId=null;draw()}};
          b.appendChild(inp);
          if(editId===it.id)setTimeout(function(){inp.focus()},0);
        }else b.appendChild(h("div",{class:"t",text:it.text}));
        if(it.name&&!isHead)b.appendChild(h("div",{class:"by",text:"Added by "+it.name}));
        var li=h("li",{class:isHead?"head":(it.check&&it.done?"done":"")});
        li.dataset.id=it.id;if(isNew(it))li.classList.add("new");
        if(editing&&sorted.length>1){
          var grip=h("button",{class:"ic grip","aria-label":"Drag to reorder",title:"Drag to reorder",text:"⠿"});
          grip.addEventListener("pointerdown",function(e){
            e.preventDefault();li.classList.add("drag");ul.classList.add("dragging");try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}
            var mv=function(ev){
              var y=ev.clientY,sibs=[].slice.call(ul.children).filter(function(n){return n!==li&&n.dataset.id}),before=null,i,r;
              for(i=0;i<sibs.length;i++){r=sibs[i].getBoundingClientRect();if(y<r.top+r.height/2){before=sibs[i];break}}
              if(before)ul.insertBefore(li,before);else ul.appendChild(li);
              if(y<70)window.scrollBy(0,-12);else if(y>window.innerHeight-70)window.scrollBy(0,12);
            };
            var up=function(){
              window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
              li.classList.remove("drag");ul.classList.remove("dragging");
              var pv=li.previousElementSibling,nx=li.nextElementSibling,po=null,no=null;
              items.forEach(function(x){if(pv&&x.id===pv.dataset.id)po=ordOf(x);if(nx&&x.id===nx.dataset.id)no=ordOf(x)});
              var nw=(po!=null&&no!=null)?(po+no)/2:(po!=null?po+1000:(no!=null?no-1000:null));
              if(nw!=null&&nw!==ordOf(it))patchItem(id,it,{ord:nw}).catch(function(){note.textContent="Couldn’t move the row."});
              else draw();
            };
            window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
          });
          li.appendChild(grip);
        }
        if(!isHead&&it.check){
          var c=h("button",{class:"chk","aria-label":"Toggle done",text:it.done?"✓":""});
          c.onclick=function(){patchItem(id,it,{done:!it.done}).catch(function(){note.textContent="Couldn’t update."})};
          li.appendChild(c);
        }
        if(nmap&&!isHead)li.insertBefore(h("span",{class:"num",text:nmap[it.id]+"."}),li.firstChild);
        li.appendChild(b);
        var acts=h("div",{class:"acts"});
        var tt=ic(I.title,isHead?"Remove title":"Set as title",function(){patchItem(id,it,{head:!isHead}).catch(function(){note.textContent="Couldn’t update."})});
        if(isHead)tt.classList.add("on");
        acts.appendChild(tt);
        if(!isHead){
          var cc=ic(I.circ,it.check?"Remove circle":"Add circle",function(){patchItem(id,it,{check:!it.check}).catch(function(){note.textContent="Couldn’t update."})});
          if(it.check)cc.classList.add("on");
          acts.appendChild(cc);
        }
        acts.appendChild(ic(editId===it.id?I.ok:I.edit,editId===it.id?"Save":"Edit",function(){
          if(editId===it.id){var iv=b.querySelector("input");var v=iv&&iv.value.trim();if(v&&v!==it.text)patchItem(id,it,{text:v});editId=null}else editId=it.id;
          draw();
        }));
        var delB=ic(I.del,"Delete",function(){confirmDelete(it.text,function(){
          var copy={id:it.id,text:it.text,name:it.name||"",done:!!it.done,head:!!it.head,check:!!it.check,ts:it.ts};
          delItem(id,it).then(function(){undoSt.push({lid:id,it:copy});redoSt=[];showBar("Item deleted")}).catch(function(){note.textContent="Couldn’t remove."});
        })});acts.appendChild(delB);
        var sx=0,sy=0;
        li.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;li.style.transition="none"},{passive:true});
        li.addEventListener("touchmove",function(e){
          if(!isEd)return;var t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
          if(dx<-8&&Math.abs(dx)>Math.abs(dy)){
            var p=Math.min(1,-dx/80);
            li.style.transform="translateX("+Math.max(dx,-120)+"px)";
            li.style.background="rgba(179,64,47,"+(0.12+0.28*p)+")";
            li.style.borderRadius="10px";
          }else{li.style.transform="";li.style.background=""}
        },{passive:true});
        function resetSwipe(){li.style.transition="transform .2s,background .2s";li.style.transform="";li.style.background=""}
        li.addEventListener("touchcancel",resetSwipe,{passive:true});
        li.addEventListener("touchend",function(e){var t=e.changedTouches[0];resetSwipe();if(isEd&&t.clientX-sx<-80&&Math.abs(t.clientY-sy)<40)delB.click()},{passive:true});
        li.appendChild(acts);
        ul.appendChild(li);
      });
    }
    tog.onclick=function(){
      editing=!editing;
      if(mine){panel.style.display=editing?"grid":"none";tog.textContent=editing?"Done":"Add or edit";if(editing)tx.focus()}
      else tog.textContent=editing?"Done":"Edit rows";
      draw();
    };
    function norm(t){return String(t||"").toLowerCase().replace(/\s+/g," ").trim()}
    function add(){
      var v=tx.value.trim();if(!v)return;
      var dup=items.some(function(i){return !i.head&&norm(i.text)===norm(v)});
      if(dup){confirmDup(v,function(){doAdd(v)});return}
      doAdd(v);
    }
    function doAdd(v){
      try{localStorage.setItem("elist-name",nm.value.trim())}catch(e){}
      tx.value="";ab.disabled=true;
      var nmv=nm.value.trim(),chk=wc.checked;
      addItem(id,v,nmv,chk).then(function(nid){if(nid){addedMine[nid]=1;undoSt.push({type:"add",lid:id,it:{id:nid,text:v,name:nmv,done:false,head:false,check:!!chk,ts:Date.now()}});redoSt=[];showBar("Added ✓")}}).catch(function(){note.textContent="Couldn’t save. You may not have permission to add."});
    }
    ab.onclick=add;tx.oninput=function(){ab.disabled=!tx.value.trim()};tx.onkeydown=function(e){if(e.key==="Enter")add()};

    unsub.push(subList(id,function(l){
      if(!l){title.textContent="List not found";return}
      title.textContent=l.title;document.title=l.title+" · Elist";syncShare();
      if(!!l.numbered!==numbered){numbered=!!l.numbered;draw()}
    }));
    unsub.push(subItems(id,function(its){if(its){items=its;loaded=true;draw()}else note.textContent="Couldn’t load the list."}));
    draw();
  }

  function route(){
    hideBar();undoSt=[];redoSt=[];
    var hh=location.hash.replace("#","");
    if(hh.indexOf("l-")===0)list(hh.slice(2));else if(hh==="lists")lists();else{document.title="Elist — the free running list";home()}
  }
  /* Detect the Elist link-preview server (see elist-worker.js). If it answers, previews and short links switch on. */
  try{fetch("/api/ping",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.elist)window.ELIST_SERVER=true}).catch(function(){})}catch(e){}
  window.addEventListener("hashchange",route);
  route();

  /* Shared database: Firebase Firestore (config in the SETUP block at the top of the page) */
  var FC=window.FIREBASE_CONFIG;
  if(FC&&FC.apiKey&&window.firebase){
    try{firebase.initializeApp(FC);db=firebase.firestore();route()}catch(e){console.error("Firebase setup failed",e)}
  }
})();
</script>
</body>
